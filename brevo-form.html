<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --accent: #f2aa32;
      --text: #f5f7f4;
      --muted: #a9b6b7;
      --field: #ffffff;
      --field-text: #101719;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    form {
      display: grid;
      gap: 12px;
      width: 100%;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      background: var(--field);
      color: var(--field-text);
      font-size: 0.95rem;
      outline: none;
    }

    input::placeholder {
      color: #748081;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(242, 170, 50, 0.20);
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #17100a;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    button:hover {
      filter: brightness(1.06);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <form id="sib-form" method="POST" target="_top" action="https://840b08c5.sibforms.com/serve/MUIFAEkODNP2dWdUJKC-jtdrAWBxbLBIqm2hsfIqvOWjlzVzT3aRXihL99Qe9aqLbwostLxd1JeJ_os5XnmVT0skdXM7wOBt67ierH4L2VguaPRieNzke5jTKK6jRVA0cBa877VBodGGcWbtoscDxcTeFoph5AH7zvGruZ4iIKNivHD6TFY8kHEbD7lkwbQQMzRKDn77tYc-63l9" data-type="subscription">
    <input type="email" id="EMAIL" name="EMAIL" autocomplete="email" placeholder="Seu melhor e-mail" required>
    <input type="hidden" name="WHATSAPP__COUNTRY_CODE" value="+55">
    <input type="tel" id="WHATSAPP" name="WHATSAPP" autocomplete="tel" placeholder="WhatsApp com DDD" required>
    <button type="submit">Acessar aula gratuita agora</button>
    <input type="text" name="email_address_check" value="" style="display:none">
    <input type="hidden" name="locale" value="pt">
    <p class="hint">100% online e gratuito.</p>
  </form>
</body>
</html>
